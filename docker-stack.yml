version: "3.8"

services:
  fastapi_app:
    image: hhilal/fastapi-crud-app:latest
    deploy:
      replicas: 2  
      restart_policy:
        condition: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - fastapi_network
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres_db:5432/fastapi_crud
      REDIS_URL: redis://redis_cache:6379

  postgres_db:
    image: postgres:13
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: fastapi_crud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network

  redis_cache:
    image: redis:latest
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - fastapi_network

volumes:
  postgres_data:

networks:
  fastapi_network:
    driver: overlay
