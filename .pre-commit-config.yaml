repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=79]

  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.0
    hooks:
      - id: pylint
        args: [--disable=C0114,C0115,C0116]
  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.0
    hooks:
      - id: pylint
        args:
          [
            "--disable=C0114,C0115,C0116,W0718,E0401",
          ]
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--ignore=E501]  # Satır uzunluğu hatasını (E501) yok say

  - repo: https://github.com/PyCQA/pylint
    rev: v3.0.2
    hooks:
      - id: pylint
        args: [--disable=C0114,C0115,C0116,R0903,E0401]  
        # Açıklamalar:
        # - C0114: "Missing module docstring" hatasını görmezden gel
        # - C0115: "Missing class docstring" hatasını görmezden gel
        # - C0116: "Missing function docstring" hatasını görmezden gel
        # - R0903: "Too few public methods" (Az sayıda public metot) hatasını görmezden gel
        # - E0401: "Import error" hatasını görmezden gel
  - repo: https://github.com/PyCQA/pylint
    hooks:
      - id: pylint
        args: ["--disable=R0903"]

  - repo: https://github.com/pycqa/flake8
    hooks:
      - id: flake8
        args: ["--max-line-length=100"]  # Default 79 yerine 100 karakter kullan
