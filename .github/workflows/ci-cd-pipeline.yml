name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: fastapi_crud
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Run Linter (Flake8)
        run: |
          pip install flake8
          flake8 --ignore=E501 app/

      - name: 🔬 Run Tests
        env:
          DATABASE_URL: postgresql://postgres:mysecretpassword@localhost:5432/fastapi_crud
          REDIS_URL: redis://localhost:6379
        run: |
          pytest

  build-and-push:
    name: 🚀 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test  
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t hhilal959/fastapi-crud-app:latest .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push hhilal959/fastapi-crud-app:latest
